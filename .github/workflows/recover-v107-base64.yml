name: Recover v1.0.7 binary as text chunks

on:
  push:
    branches: [merged-mods]
    paths:
      - '.github/workflows/recover-v107-base64.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export committed v1.0.7 archive as base64 chunks
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin all-projects:refs/remotes/origin/all-projects
          mkdir -p .recovery-v107/base64
          git show 'origin/all-projects:merged mods/deltarune-compatibility-merge/release/DELTARUNE_Compatibility_Merge_Deltamod_v1.0.7.zip' > /tmp/v107.zip
          sha256sum /tmp/v107.zip | tee .recovery-v107/archive.sha256
          stat -c '%s' /tmp/v107.zip | tee .recovery-v107/archive.size
          base64 -w 0 /tmp/v107.zip | split -b 600000 -d -a 3 - .recovery-v107/base64/chunk-
          wc -c .recovery-v107/base64/chunk-* > .recovery-v107/chunk-sizes.txt
          ls -1 .recovery-v107/base64/chunk-* | wc -l | tee .recovery-v107/chunk-count.txt
      - name: Commit recovery chunks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .recovery-v107
          git commit -m 'chore: temporary v1.0.7 recovery chunks'
          git push origin HEAD:merged-mods
