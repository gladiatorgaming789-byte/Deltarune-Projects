name: Cleanup temporary merge recovery files

on:
  push:
    branches: [merged-mods]
    paths:
      - '.github/workflows/cleanup-merge-recovery.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove temporary recovery scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -rf --ignore-unmatch \
            .recovery-v107 \
            .recovery-v107-ch5 \
            .recovery-v107-ch5.txt \
            .github/workflows/recover-v107-base64.yml \
            .github/workflows/recover-v107-ch5-patch.yml \
            .github/workflows/export-recovery-artifact.yml \
            .github/workflows/export-v107-package-artifact.yml \
            .github/workflows/cleanup-merge-recovery.yml
          if git diff --cached --quiet; then
            echo 'Nothing to clean.'
            exit 0
          fi
          git commit -m 'chore: remove temporary merge recovery scaffolding'
          git push origin HEAD:merged-mods
