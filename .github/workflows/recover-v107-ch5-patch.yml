name: Recover v1.0.7 Chapter 5 patch

on:
  push:
    branches: [merged-mods]
    paths:
      - '.github/workflows/recover-v107-ch5-patch.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract Chapter 5 xdelta
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin all-projects:refs/remotes/origin/all-projects
          git show 'origin/all-projects:merged mods/deltarune-compatibility-merge/release/DELTARUNE_Compatibility_Merge_Deltamod_v1.0.7.zip' > /tmp/v107.zip
          rm -rf /tmp/v107 && mkdir -p /tmp/v107
          unzip -q /tmp/v107.zip -d /tmp/v107
          printf 'ARCHIVE LIST\n' > .recovery-v107-ch5.txt
          unzip -l /tmp/v107.zip >> .recovery-v107-ch5.txt
          printf '\nMODDING XML\n' >> .recovery-v107-ch5.txt
          cat /tmp/v107/modding.xml >> .recovery-v107-ch5.txt
          patch=$(find /tmp/v107 -type f -iname '*chapter5*.xdelta' -o -type f -path '*/patches/chapter5.xdelta' | head -n1)
          test -n "$patch"
          mkdir -p .recovery-v107-ch5/base64
          sha256sum "$patch" | tee .recovery-v107-ch5/patch.sha256
          stat -c '%s' "$patch" | tee .recovery-v107-ch5/patch.size
          base64 -w 0 "$patch" | split -b 120000 -d -a 3 - .recovery-v107-ch5/base64/chunk-
          ls -1 .recovery-v107-ch5/base64/chunk-* | wc -l | tee .recovery-v107-ch5/chunk-count.txt
      - name: Commit recovered patch chunks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .recovery-v107-ch5.txt .recovery-v107-ch5
          git commit -m 'chore: temporary v1.0.7 Chapter 5 patch recovery'
          git push origin HEAD:merged-mods
