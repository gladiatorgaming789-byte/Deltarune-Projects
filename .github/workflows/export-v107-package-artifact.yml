name: Export v1.0.7 package artifact

on:
  push:
    branches: [merged-mods]
    paths:
      - '.github/workflows/export-v107-package-artifact.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover committed v1.0.7 archive
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin all-projects:refs/remotes/origin/all-projects
          git show 'origin/all-projects:merged mods/deltarune-compatibility-merge/release/DELTARUNE_Compatibility_Merge_Deltamod_v1.0.7.zip' > DELTARUNE_Compatibility_Merge_Deltamod_v1.0.7.zip
          sha256sum DELTARUNE_Compatibility_Merge_Deltamod_v1.0.7.zip
          test "$(sha256sum DELTARUNE_Compatibility_Merge_Deltamod_v1.0.7.zip | cut -d' ' -f1)" = 'f6d0fa4ed8328b283f47fc95ebb5ff0c2c17527bede19a56c2c5bacf1f3e3b61'
      - uses: actions/upload-artifact@v4
        with:
          name: deltarune-v107-package
          path: DELTARUNE_Compatibility_Merge_Deltamod_v1.0.7.zip
          if-no-files-found: error
          compression-level: 0
