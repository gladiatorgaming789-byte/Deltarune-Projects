name: Export merge recovery artifact

on:
  push:
    branches: [merged-mods]
    paths:
      - '.github/workflows/export-recovery-artifact.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover Chapter 5 patch and xdelta3
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin all-projects:refs/remotes/origin/all-projects
          mkdir -p recovery
          git show 'origin/all-projects:merged mods/deltarune-compatibility-merge/release/DELTARUNE_Compatibility_Merge_Deltamod_v1.0.7.zip' > /tmp/v107.zip
          unzip -p /tmp/v107.zip patches/chapter5.xdelta > recovery/v107_chapter5.xdelta
          cat .merge-tools/xdelta3-base64/chunk-000.txt | base64 -d > recovery/xdelta3
          chmod +x recovery/xdelta3
          sha256sum recovery/v107_chapter5.xdelta recovery/xdelta3 | tee recovery/SHA256SUMS.txt
          stat -c '%n %s' recovery/v107_chapter5.xdelta recovery/xdelta3 | tee recovery/SIZES.txt
          test "$(sha256sum recovery/xdelta3 | cut -d' ' -f1)" = 'dc6bdc6ee86b2b3e389c937610c0b2508e31ca53c197de6f9c176909c546a846'
          test "$(sha256sum recovery/v107_chapter5.xdelta | cut -d' ' -f1)" = '59eec2e2efa696900f91a66035204891ed7dae066f271238ca26d5807e6fcca3'
      - uses: actions/upload-artifact@v4
        with:
          name: deltarune-merge-recovery
          path: recovery/
          if-no-files-found: error
          compression-level: 0
