name: Fetch current Pink Deltamod archive

on:
  push:
    branches: [merged-mods]
    paths:
      - .github/workflows/fetch-current-pink-mod.yml

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download current Deltamod archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          curl -fL --retry 4 --retry-all-errors --compressed \
            'https://gamebanana.com/dl/1762436' \
            -o out/improvedpinkbackgroundv2deltamod.zip
          echo '31df8555573a6e6b713d6c52b197ae79  out/improvedpinkbackgroundv2deltamod.zip' | md5sum -c -
          file out/improvedpinkbackgroundv2deltamod.zip
          unzip -l out/improvedpinkbackgroundv2deltamod.zip | head -100

      - uses: actions/upload-artifact@v4
        with:
          name: current-pink-deltamod
          path: out/improvedpinkbackgroundv2deltamod.zip
          if-no-files-found: error
